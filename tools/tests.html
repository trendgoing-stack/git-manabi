<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>簡易テスト - Gitまなび帳</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; line-height: 1.6; }
    .ok { color: #1f7a3d; } .ng { color: #b3261e; font-weight: 700; }
    @media (prefers-color-scheme: dark) { .ok { color: #7ddc9b; } .ng { color: #ff8a80; } }
    li { margin: 2px 0; }
  </style>
</head>
<body>
  <h1>簡易テスト</h1>
  <p id="summary"></p>
  <ul id="list"></ul>
  <script type="module">
    import { runTests } from './tests.js';
    const results = runTests();
    const ng = results.filter((r) => !r.ok).length;
    const sum = document.getElementById('summary');
    sum.textContent = `${results.length - ng} / ${results.length} 件成功`;
    sum.className = ng ? 'ng' : 'ok';
    document.getElementById('list').replaceChildren(...results.map((r) => {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'ng';
      li.textContent = `${r.ok ? '✓' : '✗'} ${r.name}${r.detail ? '：' + r.detail : ''}`;
      return li;
    }));
  </script>
</body>
</html>
